    <title>Keith: web app not built</title>

      body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }

  <body>
    <h1>The web app isn't built</h1>
    <p>
      Keith is running and <code>@keith/web</code> is installed, but its browser app has no build output yet.
      Build the app (it goes to <code>plugins/web/dist/</code>), or point the plugin's <code>distDir</code>
      option at a built copy, then restart Keith.
    </p>
    <p>The public protocol under <code>/v1</code> works as usual.</p>
  </body>
