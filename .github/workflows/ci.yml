name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Chromium for the Playwright e2e tests (tests/e2e/s8-web.test.ts, s7-voice.test.ts), matching the installed
      # Playwright version (https://playwright.dev/docs/ci).
      - run: bunx playwright install --with-deps chromium
      # The web app the core serves at / (plugins/web/dist). The S-8 e2e test builds its own copy.
      - run: bun run --cwd plugins/web build
      - run: bun run check
      # S-8 in a real browser (TUI only, enable @keith/web, restart), five runs in a row (P2-I1, P3-I3).
      - run: for i in 1 2 3 4 5; do bun test tests/e2e/s8-web.test.ts || exit 1; done
      # S-1 incl. the non-greeting branch, five runs in a row (P3-I3).
      - run: for i in 1 2 3 4 5; do bun test tests/e2e/s1-arrival.test.ts || exit 1; done
      # S-7 in a real browser with a fake microphone (a generated WAV), five runs in a row (P3-I2).
      - run: for i in 1 2 3 4 5; do bun test tests/e2e/s7-voice.test.ts || exit 1; done
      # S-3 semantic (reflection, restart, memory.recall, I-4) and the S-1 reminder, five runs in a row (P4-I2).
      - run: for i in 1 2 3 4 5; do bun test tests/e2e/s3-semantic.test.ts || exit 1; done
      - run: for i in 1 2 3 4 5; do bun test tests/e2e/s1-reminder.test.ts || exit 1; done
